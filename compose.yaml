# Ambiente local de testes (API + Postgres). Sobe junto com `bun expo start` em apps/mobile.
services:
  # API do DnF (core/server.ts: Hono + Drizzle). Em dev roda o código do repo direto (sem build da imagem).
  api:
    image: oven/bun:1
    working_dir: /app/core
    command: bun server.ts
    # Fedora/SELinux: sem isto o container não lê o repo montado em /app.
    security_opt:
      - label=disable
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://dnf:dnf@postgres:5432/dnf
      # Só para dev: em produção o AUTH_SECRET vem do .env do NAS (openssl rand -hex 32).
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      CORS_ORIGINS: '*'
      NAS_DIR: /nas
      FILES_DIR: /files
      DND_API_URL: ${DND_API_URL:-}
      DND_API_ACCESS_ID: ${DND_API_ACCESS_ID:-}
      DND_API_ACCESS_SECRET: ${DND_API_ACCESS_SECRET:-}
      TTS_PROVIDERS: ${TTS_PROVIDERS:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      PIPER_URL: ${PIPER_URL:-}
    volumes:
      - ./:/app
      - ./core/nas:/nas:ro
      - dnf-files:/files
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dnf
      POSTGRES_PASSWORD: dnf
      POSTGRES_DB: dnf
    volumes:
      - dnf-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnf"]
      interval: 2s
      timeout: 2s
      retries: 15

  # 5e-FastAPI local (repo clonado em ../5e-FastAPI). Só sobe com `docker compose --profile dnd up dnd-api`.
  # Precisa do banco em ../5e-FastAPI/app/dados/dnd.db (não é versionado; copie do NAS:
  #   scp ale@nas-ale:/srv/apps/5e-fastapi/app/dados/dnd.db ../5e-FastAPI/app/dados/).
  # Para a API do DnF usar esta (sem token do Cloudflare), ponha DND_API_URL=http://dnd-api:8000 no .env.
  dnd-api:
    profiles: ["dnd"]
    build: ../5e-FastAPI
    ports:
      - "8000:8000"
    environment:
      DND_ORIGENS_CORS: "*"
    volumes:
      - ../5e-FastAPI/app/dados/dnd.db:/srv/5e-fastapi/app/dados/dnd.db:ro

volumes:
  dnf-pg:
  dnf-files:
