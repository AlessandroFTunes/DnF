# Ambiente local de testes. Sobe junto com `bun expo start` em apps/mobile.
services:
  pocketbase:
    build: ./core
    ports:
      - "8090:8090"
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@dnf.local}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-dnf-dev-password}
      # Token do Cloudflare Access usado pela rota /srd (core/pb_hooks/srd.pb.js). Vem do .env da raiz.
      DND_API_ACCESS_ID: ${DND_API_ACCESS_ID:-}
      DND_API_ACCESS_SECRET: ${DND_API_ACCESS_SECRET:-}
      DND_API_URL: ${DND_API_URL:-}
      # Narração da subida de nível (core/pb_hooks/tts.pb.js). Sem a chave, a celebração fica muda.
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL_ID: ${ELEVENLABS_MODEL_ID:-}
      ELEVENLABS_ENVIRONMENT: ${ELEVENLABS_ENVIRONMENT:-}
    # Cria/atualiza o superuser de dev e sobe em modo --dev (logs SQL, migrations geradas pelo Dashboard).
    command: >
      sh -c './pocketbase superuser upsert "$$PB_ADMIN_EMAIL" "$$PB_ADMIN_PASSWORD"
      && exec ./pocketbase serve --http=0.0.0.0:8090 --dev'
    volumes:
      - ./core/pb_data:/pb/pb_data
      - ./core/pb_migrations:/pb/pb_migrations
      - ./core/pb_hooks:/pb/pb_hooks
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 2s
      timeout: 2s
      retries: 15
